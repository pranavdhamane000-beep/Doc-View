name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create gradle wrapper
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5.1-bin.zip
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Download Gradle wrapper
        run: |
          wget -q https://raw.githubusercontent.com/gradle/gradle/v7.5.1/gradlew -O gradlew
          chmod +x gradlew
          wget -q https://raw.githubusercontent.com/gradle/gradle/v7.5.1/gradlew.bat -O gradlew.bat
          wget -q https://services.gradle.org/distributions/gradle-7.5.1-bin.zip -P gradle/wrapper/
          
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: DocViewer-APK
          path: app/build/outputs/apk/release/app-release.apk
